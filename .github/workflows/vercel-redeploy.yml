name: Redeploy backend and frontend on push
on:
  push:
    branches: [main]

jobs:
  redeploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Backend Vercel Deploy Hook
        run: curl -X POST -fsSL "$BACKEND_HOOK"
        env:
          BACKEND_HOOK: ${{ secrets.BACKEND_HOOK }}

      - name: Trigger Frontend Vercel Deploy Hook
        run: curl -X POST -fsSL "$FRONTEND_HOOK"
        env:
          FRONTEND_HOOK: ${{ secrets.FRONTEND_HOOK }}
